services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
